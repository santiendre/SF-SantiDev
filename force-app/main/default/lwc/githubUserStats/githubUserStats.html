<template>
    <lightning-card title="User Information">
        <template lwc:if={userProfile}>
            <div class="slds-p-around_medium">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <img src={userProfile.avatarUrl} 
                             alt="GitHub Avatar" 
                             style="width:80px; height:80px; border-radius:50%;"/>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-text-heading_medium slds-m-bottom_x-small">{userProfile.login}</h2>
                        <p class="slds-text-color_weak slds-m-bottom_x-small">{userProfile.bio}</p>
                        <div class="slds-grid slds-gutters_small">
                            <div class="slds-col">
                                <p><strong>⭐ Repos:</strong> {userProfile.publicRepos}</p>
                            </div>
                            <div class="slds-col">
                                <p><strong>👥 Followers:</strong> {userProfile.followers}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <template lwc:else>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_weak">Search for a GitHub user to see their profile.</p>
            </div>
        </template>
    </lightning-card>
</template>
