<template>
  <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
    <lightning-layout>
      <lightning-layout-item class="slds-col slds-size_4-of-12 slds-m-right_x-small">
        <lightning-input type="text" label="Username" placeholder="Enter GitHub username" variant="label-hidden" value={username} onchange={handleUsername}></lightning-input>
      </lightning-layout-item>
      <lightning-layout-item class="slds-col slds-size_2-of-12">
        <lightning-button label="Search" onclick={handleSearch}></lightning-button>
      </lightning-layout-item>
    </lightning-layout>
  </div>
</template>
